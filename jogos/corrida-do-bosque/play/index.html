<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Corrida do Bosque</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c1430;
        color: #f4f1fb;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        position: relative;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        margin: 0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <p id="hud">Pontos: <span id="pontos">0</span></p>
    <canvas id="pista" width="960" height="540"></canvas>
    <script>
      var canvas = document.getElementById("pista");
      var ctx = canvas.getContext("2d");
      var pontos = document.getElementById("pontos");
      var lanes = [280, 480, 680];
      var lane = 1;
      var trees = [];
      var speed = 240;
      var distance = 0;
      var spawn = 0;
      var over = false;
      var last = performance.now();

      function reset() {
        lane = 1;
        trees = [];
        speed = 240;
        distance = 0;
        spawn = 0;
        over = false;
        pontos.textContent = "0";
      }

      function draw() {
        ctx.fillStyle = "#14301c";
        ctx.fillRect(0, 0, 960, 540);
        ctx.fillStyle = "#5c4030";
        ctx.fillRect(220, 0, 520, 540);
        ctx.fillStyle = "#f6f4fb";
        ctx.fillRect(470, 0, 16, 540);

        trees.forEach(function (tree) {
          ctx.fillStyle = "#1f7a3a";
          ctx.beginPath();
          ctx.arc(tree.x, tree.y, 36, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#5c4030";
          ctx.fillRect(tree.x - 6, tree.y + 20, 12, 28);
        });

        var carX = lanes[lane];
        ctx.fillStyle = "#f5b800";
        ctx.fillRect(carX - 28, 430, 56, 80);
        ctx.fillStyle = "#1c1430";
        ctx.fillRect(carX - 16, 448, 32, 22);

        if (over) {
          ctx.fillStyle = "rgba(28, 20, 48, 0.72)";
          ctx.fillRect(0, 0, 960, 540);
          ctx.fillStyle = "#f4f1fb";
          ctx.font = "700 42px Segoe UI, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Fim da corrida", 480, 250);
          ctx.font = "24px Segoe UI, sans-serif";
          ctx.fillText("Toque ou espaço para recomeçar", 480, 300);
        }
      }

      function frame(now) {
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (!over) {
          distance += dt;
          speed += dt * 8;
          spawn -= dt;
          pontos.textContent = String(Math.floor(distance));
          if (spawn <= 0) {
            var pick = Math.floor(Math.random() * 3);
            trees.push({ x: lanes[pick], y: -40 });
            spawn = Math.max(0.45, 1.15 - distance / 40);
          }
          trees.forEach(function (tree) {
            tree.y += speed * dt;
          });
          trees = trees.filter(function (tree) {
            return tree.y < 600;
          });
          var carX = lanes[lane];
          trees.forEach(function (tree) {
            var dx = tree.x - carX;
            var dy = tree.y - 470;
            if (dx * dx + dy * dy < 70 * 70) over = true;
          });
        }
        draw();
        requestAnimationFrame(frame);
      }

      function move(direction) {
        if (over) {
          reset();
          return;
        }
        lane = Math.max(0, Math.min(2, lane + direction));
      }

      window.addEventListener("keydown", function (event) {
        var key = event.key;
        if (key === "ArrowLeft" || key === "a" || key === "A") {
          event.preventDefault();
          move(-1);
        } else if (key === "ArrowRight" || key === "d" || key === "D") {
          event.preventDefault();
          move(1);
        } else if (key === " " && over) {
          event.preventDefault();
          reset();
        }
      });

      canvas.addEventListener("pointerdown", function (event) {
        var rect = canvas.getBoundingClientRect();
        move(event.clientX - rect.left < rect.width / 2 ? -1 : 1);
      });

      reset();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
